<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 佛像粒子展示</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      background: #000;
    }

    #stage:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="3D 佛像粒子动态展示"></canvas>

  <script src="./src/main.js" defer></script>
</body>
</html>
